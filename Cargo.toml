[package]
name = "trident"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.5"
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
lz4_flex = "0.11"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.9"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.13"

[features]
default = ["cpu"]
cpu = []
cuda = []
vulkan = []
metal = []
